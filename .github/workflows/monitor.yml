name: Halloween Ticket Monitor

on:
  schedule:
    # 每小时排两个 cron（GitHub 定时任务高峰期会丢，双保险；脚本内有 40 分钟防重）
    - cron: "3,33 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/halloween-monitor/
        run: python monitor.py

      - name: Publish report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          keep_files: false
